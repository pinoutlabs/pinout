name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to test at its current merge ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:run') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
      - name: Governed coffee-machine demo (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run demo:coffee
      - name: Awareness + connector demo SIMULATED (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run demo:awareness
      - name: Documentation and catalog gate (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run docs:check
      - name: Format check (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run format:check

  python-sdk:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:run') }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python SDK
        run: pip install -e .[dev]
      - name: Run Python SDK tests
        run: pytest tests -q
      - name: Install Python module SDK
        run: pip install -e ../python-module[dev]
      - name: Run Python module SDK tests
        run: pytest ../python-module/tests -q

  micropython-bridge:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MicroPython bridge protocol (host-side)
        working-directory: firmware/micropython-bridge
        run: node validate.js
      - name: Validate Pico profile + machine stub (SIMULATED)
        working-directory: firmware/micropython-bridge
        run: node validate-pico.js

  firmware:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32 firmware (classic + S2/S3, compile-only)
        working-directory: firmware/esp32-bridge
        # C3 and C6 stay opt-in; the release-candidate workflow compiles C3 explicitly.
        run: pio run -e esp32dev -e esp32s2-devkit -e esp32s3-devkit
      - name: Compile Uno firmware
        run: pio run -d firmware/uno-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise Uno firmware source with simulated GPIO
        run: node scripts/test-uno-firmware.mjs
      - name: Upload classic ESP32 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-bridge-esp32dev
          path: |
            firmware/esp32-bridge/.pio/build/esp32dev/firmware.bin
            firmware/esp32-bridge/.pio/build/esp32dev/firmware.elf
            firmware/esp32-bridge/.pio/build/esp32s2-devkit/firmware.bin
            firmware/esp32-bridge/.pio/build/esp32s2-devkit/firmware.elf
            firmware/esp32-bridge/.pio/build/esp32s3-devkit/firmware.bin
            firmware/esp32-bridge/.pio/build/esp32s3-devkit/firmware.elf
          if-no-files-found: error

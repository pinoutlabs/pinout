[platformio]
default_envs = esp32dev-ble

; BLE GATT bridge for Pinout NDJSON. Adjacent to firmware/esp32-bridge (USB serial).
; Status: sketch is intended for PlatformIO compile evidence only until a dated
; hardware record exists. Host CI uses the SIMULATED BLE GATT bridge — no radio.

[env:esp32dev-ble]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_BLE_BRIDGE=1

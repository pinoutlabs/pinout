[platformio]
; Classic ESP32 remains the default CI compile gate. C3 and S3 are first-class
; PlatformIO environments (COMPILE_TESTED) but stay out of the default gate
; until physical HIL records exist.
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.x keeps the LEDC API used by this bridge stable. Upgrade to
; core 3.x only with the corresponding API migration and hardware record.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32-c3-supermini]
; Native USB Serial/JTAG. Pin map matches firmware/boards/esp32-c3-supermini.json.
; Status: COMPILE_TESTED — never auto-flash; operator must identify then upload.
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_C3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
; Native USB Serial/JTAG. Pin map matches firmware/boards/esp32-s3-devkitc-1.json.
; Status: COMPILE_TESTED — never auto-flash; operator must identify then upload.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

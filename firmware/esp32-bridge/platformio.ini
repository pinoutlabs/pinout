[platformio]
; Classic ESP32 is the default compile gate. C3/S3 are first-class release
; targets; S2/C6 family profiles remain opt-in pending their own evidence.
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.x keeps the LEDC API used by this bridge stable. Upgrade to
; core 3.x only with the corresponding API migration and hardware record.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32-c3-supermini]
; Experimental native USB Serial/JTAG target. Keep opt-in until HIL confirms
; reset-line and pin-safety behavior.
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_C3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2-devkit]
; Experimental ESP32-S2 profile. PlatformIO 6.5.0 ships no definition for the
; S2-DevKitC-1, so this env builds with the ESP32-S2-Saola-1 board definition
; (same ESP32-S2 module family, 4 MB flash, UART0 on GPIO 43/44). Flash the
; DevKitC-1 hardware; the firmware's validated pin table is the DevKitC-1 one
; from firmware/boards/esp32-s2-devkitc-1.json. Compile and HIL verification
; are pending; keep it opt-in.
platform = espressif32@6.5.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_S2=1

[env:esp32s3-devkit]
; Experimental ESP32-S3 profile. Same Arduino-ESP32 2.x line as esp32dev, but
; compile and HIL verification are still pending, so keep it opt-in.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6-devkit]
; Experimental ESP32-C6 profile. The C6 requires an Arduino-ESP32 3.x core via
; the pioarduino community platform; that core moves LEDC behind
; ledcAttachChannel, which src/boards/ledc_compat.h maps back to the classic
; calls. Opt-in only: compile and HIL verification are still pending.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_C6=1

[env:esp32-s3-devkitc-1]
; Release-workflow name for the same S3 profile as esp32s3-devkit.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

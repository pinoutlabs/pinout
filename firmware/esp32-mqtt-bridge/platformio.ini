[platformio]
; Local Wi-Fi + MQTT bridge for classic ESP32. Compile-only evidence until a
; dated hardware record exists — never claim HARDWARE_VERIFIED from a build.
default_envs = esp32-mqtt

[env:esp32-mqtt]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
  knolleary/PubSubClient@^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=0
; Optional overrides (uncomment and edit, or copy include/pinout_mqtt_config.h.example):
;   -DPINOUT_WIFI_SSID=\"myssid\"
;   -DPINOUT_WIFI_PASSWORD=\"secret\"
;   -DPINOUT_MQTT_HOST=\"192.168.1.10\"
;   -DPINOUT_MQTT_PORT=1883
;   -DPINOUT_MQTT_DEVICE_ID=\"local\"
